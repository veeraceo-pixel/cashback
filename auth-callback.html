<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifying Email — SmartCash</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fa;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .card{background:white;border-radius:20px;padding:3rem 2.5rem;text-align:center;max-width:420px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.1);border:1px solid #e2e8f0;}
  .icon{font-size:3.5rem;margin-bottom:1.25rem;}
  h1{font-size:1.4rem;font-weight:800;color:#1a202c;margin-bottom:.5rem;}
  p{color:#718096;font-size:.9rem;line-height:1.65;margin-bottom:1.5rem;}
  .spinner{width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#00C896;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1.5rem;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn{display:inline-block;background:#00C896;color:white;padding:.8rem 2rem;border-radius:10px;font-weight:700;text-decoration:none;cursor:pointer;border:none;font-size:.95rem;transition:all .2s;}
  .btn:hover{background:#00A07A;}
  .error{background:#fff5f5;border:1px solid #fed7d7;border-radius:10px;padding:1rem;color:#c53030;font-size:.85rem;margin-bottom:1.25rem;}
  .logo{font-size:1.4rem;font-weight:800;color:#1a202c;margin-bottom:2rem;display:block;}
  .logo span{color:#00C896;}
</style>
</head>
<body>
<div class="card">
  <a href="app.html" class="logo">Smart<span>Cash</span></a>
  <div id="content">
    <div class="spinner"></div>
    <h1>Verifying your email…</h1>
    <p>Please wait while we confirm your email address and log you in.</p>
  </div>
</div>

<script>
async function handleCallback() {
  const content = document.getElementById('content');

  // Supabase puts the tokens in the URL hash
  const hash = window.location.hash;
  const params = new URLSearchParams(hash.replace('#', '?').replace('#', '&'));
  const accessToken = params.get('access_token');
  const refreshToken = params.get('refresh_token');
  const errorDesc = params.get('error_description');

  // Check for error in hash
  if (errorDesc) {
    content.innerHTML = `
      <div class="icon">❌</div>
      <h1>Verification Failed</h1>
      <div class="error">${decodeURIComponent(errorDesc.replace(/\+/g,' '))}</div>
      <p>The link may have expired. Please try signing up again.</p>
      <a href="app.html" class="btn">Back to SmartCash</a>`;
    return;
  }

  // Also check query params (some Supabase versions use these)
  const queryParams = new URLSearchParams(window.location.search);
  const errorParam = queryParams.get('error_description') || queryParams.get('error');
  if (errorParam) {
    content.innerHTML = `
      <div class="icon">❌</div>
      <h1>Verification Failed</h1>
      <div class="error">${decodeURIComponent(errorParam.replace(/\+/g,' '))}</div>
      <p>The link may have expired. Please try signing up again.</p>
      <a href="app.html" class="btn">Back to SmartCash</a>`;
    return;
  }

  if (!accessToken) {
    // No token — maybe they landed here directly
    content.innerHTML = `
      <div class="icon">🤔</div>
      <h1>No Verification Token</h1>
      <p>This page is only for email verification links. If you're trying to log in, go back to the homepage.</p>
      <a href="app.html" class="btn">Go to SmartCash</a>`;
    return;
  }

  // Set the session in Supabase using the tokens from the URL
  try {
    if (typeof SUPABASE_CONFIG === 'undefined' || SUPABASE_CONFIG.url === 'YOUR_SUPABASE_URL') {
      // Demo mode — just redirect
      content.innerHTML = `
        <div class="icon">✅</div>
        <h1>Email Verified!</h1>
        <p>Your account is confirmed. Redirecting to your dashboard…</p>`;
      setTimeout(() => window.location.href = 'dashboard.html', 1500);
      return;
    }

    const sb = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

    // Set session directly from tokens
    const { data, error } = await sb.auth.setSession({
      access_token: accessToken,
      refresh_token: refreshToken || ''
    });

    if (error) throw error;

    const user = data?.user;

    // Ensure user row exists in public.users table
    if (user) {
      await sb.from('users').upsert({
        id: user.id,
        email: user.email,
        full_name: user.user_metadata?.full_name || user.email.split('@')[0]
      }, { onConflict: 'id', ignoreDuplicates: true });
    }

    content.innerHTML = `
      <div class="icon">✅</div>
      <h1>Email Verified!</h1>
      <p>Welcome to SmartCash! Your account is confirmed. Taking you to your dashboard…</p>`;
    setTimeout(() => window.location.href = 'dashboard.html', 1800);

  } catch (err) {
    content.innerHTML = `
      <div class="icon">⚠️</div>
      <h1>Something went wrong</h1>
      <div class="error">${err.message}</div>
      <p>Your email may already be verified. Try logging in:</p>
      <a href="app.html" class="btn">Login to SmartCash</a>`;
  }
}

handleCallback();
</script>
</body>
</html>
